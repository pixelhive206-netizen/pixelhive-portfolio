<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you — Pixelhive Studio</title>
  <meta name="description" content="Thanks for sharing your experience with Pixelhive Studio." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e85d04'><path d='M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z'/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />

  <style>
    /* Cross-document View Transitions — smooth crossfade between pages */
    @view-transition { navigation: auto; }
    ::view-transition-old(root),
    ::view-transition-new(root) { animation-duration: 0.35s; }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(root),
      ::view-transition-new(root) { animation: none !important; }
    }

    :root {
      --bg: #faf7f2; --surface: #ffffff;
      --ink: #1a1a1a; --muted: #6b6b6b;
      --line: #ececea; --accent: #e85d04;
      --accent-soft: #fff1e6; --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    a { color: var(--accent); text-decoration: none; }

    nav {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1120px; margin: 0 auto; width: 100%;
    }
    .logo {
      font-family: 'Fraunces', serif;
      font-weight: 700; font-size: 22px;
      color: var(--ink);
      display: inline-flex; align-items: center; gap: 10px;
      letter-spacing: -0.02em;
    }
    .logo svg { color: var(--accent); }
    .logo span { color: var(--accent); }
    .back { font-size: 14px; color: var(--muted); }
    .back:hover { color: var(--accent); }

    main {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 60px 24px;
    }
    .thanks-card {
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 64px 40px;
      text-align: center;
      box-shadow: 0 20px 40px -28px rgba(0,0,0,0.12);
    }
    .thanks-mark {
      width: 72px; height: 72px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(32px, 4.5vw, 44px);
      font-weight: 500; line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }
    h1 em { color: var(--accent); font-style: italic; }
    p {
      color: var(--muted);
      font-size: 17px; max-width: 44ch;
      margin: 0 auto 30px;
      line-height: 1.6;
    }
    .back-home {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 24px;
      background: var(--ink); color: white;
      border-radius: 999px;
      font-weight: 500; font-size: 15.5px;
      transition: background .15s, transform .15s;
    }
    .back-home:hover {
      background: var(--accent);
      transform: translateY(-1px);
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 26px 24px;
      text-align: center;
      color: var(--muted); font-size: 14px;
    }
    footer a { color: var(--muted); }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 7 L17 9.5 L17 14.5 L12 17 L7 14.5 L7 9.5 Z" fill="currentColor"/></svg>
      Pixelhive<span>.</span>
    </a>
    <a href="index.html" class="back">← Back to home</a>
  </nav>

  <main>
    <div class="thanks-card">
      <div class="thanks-mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1>Thank you — <em>truly.</em></h1>
      <p>Your words mean a lot to a small studio finding its feet. We'll feature them on our portfolio soon, and may follow up by email if we need to clarify anything.</p>
      <a href="index.html" class="back-home">← Back to Pixelhive</a>
    </div>
  </main>

  <footer>© <span id="year">2026</span> Pixelhive Studio · <a href="index.html">Home</a> · <a href="privacy.html">Privacy</a></footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
