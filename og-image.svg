<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="20%" cy="30%" r="80%">
      <stop offset="0" stop-color="#141a23"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative oversized hex, top-right -->
  <g transform="translate(900 80)" opacity="0.10">
    <path d="M200 0 L348 88 L348 264 L200 352 L52 264 L52 88 Z"
          fill="none" stroke="#fbbf24" stroke-width="6"/>
    <rect x="118" y="100" width="32" height="32" rx="4" fill="#fbbf24"/>
    <rect x="180" y="155" width="32" height="32" rx="4" fill="#fbbf24"/>
    <rect x="138" y="210" width="32" height="32" rx="4" fill="#fbbf24"/>
  </g>

  <!-- Logo lockup: mark + PIXEL·HIVE + STUDIO -->
  <g transform="translate(80 100)">
    <g fill="#fbbf24">
      <path d="M60 8 L104 33 L104 87 L60 112 L16 87 L16 33 Z" fill="none" stroke="#fbbf24" stroke-width="5.5"/>
      <rect x="34" y="33" width="17" height="17" rx="2.5"/>
      <rect x="51" y="52" width="17" height="17" rx="2.5"/>
      <rect x="36" y="72" width="17" height="17" rx="2.5"/>
    </g>
    <text x="140" y="78" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" font-size="56" letter-spacing="-1.4" fill="#ffffff">PIXEL<tspan fill="#fbbf24">·</tspan>HIVE</text>
    <text x="140" y="112" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="500" font-size="18" letter-spacing="8" fill="#fbbf24">STUDIO</text>
  </g>

  <!-- Headline -->
  <text x="80" y="350" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="500"
        font-size="86" fill="#ffffff" letter-spacing="-3.4">
    Websites that load
  </text>
  <text x="80" y="438" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="500"
        font-size="86" letter-spacing="-3.4">
    <tspan fill="#fbbf24">fast,</tspan> <tspan fill="#ffffff">look</tspan> <tspan fill="#fbbf24">sharp,</tspan>
  </text>
  <text x="80" y="526" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="400"
        font-size="86" fill="rgba(245,241,234,0.85)" letter-spacing="-3.4">
    and convert.
  </text>

  <!-- Footer line -->
  <text x="80" y="588" font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="20" fill="rgba(245,241,234,0.55)" letter-spacing="2">
    CREATIVE WEB STUDIO · INDIA · HAND-CODED · DELIVERED IN 2 WEEKS
  </text>
</svg>
