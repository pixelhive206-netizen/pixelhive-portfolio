<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="20%" cy="30%" r="80%">
      <stop offset="0" stop-color="#141a23"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative hexagon, top-right -->
  <g transform="translate(960 90)" opacity="0.12">
    <path d="M180 0 L315 90 L315 270 L180 360 L45 270 L45 90 Z"
          fill="none" stroke="#fbbf24" stroke-width="6"/>
    <path d="M180 90 L255 135 L255 225 L180 270 L105 225 L105 135 Z"
          fill="#fbbf24"/>
  </g>

  <!-- accent dots, bottom-left -->
  <g transform="translate(60 470)" opacity="0.30">
    <rect x="0" y="0" width="14" height="14" fill="#fbbf24"/>
    <rect x="22" y="-18" width="9" height="9" fill="#fbbf24" opacity="0.7"/>
    <rect x="36" y="22" width="6" height="6" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- logo mark (hex + 3 drifting pixels) + wordmark -->
  <g transform="translate(80 110)">
    <g fill="#fbbf24">
      <path d="M40 12 L64 26 L64 54 L40 68 L16 54 L16 26 Z"/>
      <rect x="3" y="31" width="7" height="7"/>
      <rect x="6" y="20" width="4.5" height="4.5"/>
      <rect x="8.5" y="44" width="3" height="3"/>
    </g>
    <text x="84" y="52" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700"
          font-size="38" fill="#ffffff" letter-spacing="-1.4">
      Pixelhive
    </text>
  </g>

  <!-- headline -->
  <text x="80" y="320" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="500"
        font-size="86" fill="#ffffff" letter-spacing="-3.4">
    Websites that load
  </text>
  <text x="80" y="410" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="500"
        font-size="86" letter-spacing="-3.4">
    <tspan fill="#fbbf24">fast,</tspan> <tspan fill="#ffffff">look</tspan> <tspan fill="#fbbf24">sharp,</tspan>
  </text>
  <text x="80" y="500" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="400"
        font-size="86" fill="rgba(245,241,234,0.85)" letter-spacing="-3.4">
    and convert.
  </text>

  <!-- footer line -->
  <text x="80" y="580" font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="20" fill="rgba(245,241,234,0.55)" letter-spacing="2">
    SMALL INDIA-BASED WEB STUDIO · HAND-CODED · DELIVERED IN 2 WEEKS
  </text>
</svg>
