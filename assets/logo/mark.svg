<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" fill="currentColor" role="img" aria-label="Pixelhive">
  <title>Pixelhive mark</title>
  <!-- Honeycomb cell - the "hive" -->
  <path d="M40 12 L64 26 L64 54 L40 68 L16 54 L16 26 Z"/>
