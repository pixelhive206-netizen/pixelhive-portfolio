<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pixelhive">
  <title>Pixelhive mark</title>
  <!-- Honeycomb hex outline -->
  <path d="M50 7 L87 28 L87 72 L50 93 L13 72 L13 28 Z"
        fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="miter"/>
  <!-- Three descending pixels inside the hive -->
  <rect x="28" y="28" width="14" height="14" rx="2" fill="currentColor"/>
  <rect x="42" y="44" width="14" height="14" rx="2" fill="currentColor"/>
  <rect x="30" y="60" width="14" height="14" rx="2" fill="currentColor"/>
</svg>
