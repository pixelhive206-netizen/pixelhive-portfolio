<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pixelhive Studio">
  <title>Pixelhive Studio lockup</title>
  <style>
    .wm { font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 64px; letter-spacing: -1.5px; fill: #ffffff; }
    .dot { fill: #fbbf24; }
    .sub { font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 22px; letter-spacing: 9px; fill: #fbbf24; }
  </style>
  <!-- Mark -->
  <g transform="translate(20,30)" fill="#fbbf24">
    <path d="M60 8 L104 33 L104 87 L60 112 L16 87 L16 33 Z" fill="none" stroke="#fbbf24" stroke-width="5.5" stroke-linejoin="miter"/>
    <rect x="34" y="33" width="17" height="17" rx="2.5"/>
    <rect x="51" y="52" width="17" height="17" rx="2.5"/>
    <rect x="36" y="72" width="17" height="17" rx="2.5"/>
  </g>
  <!-- Wordmark + subline -->
  <text x="160" y="92" class="wm">PIXEL<tspan class="dot">·</tspan>HIVE</text>
  <text x="160" y="138" class="sub">STUDIO</text>
</svg>
