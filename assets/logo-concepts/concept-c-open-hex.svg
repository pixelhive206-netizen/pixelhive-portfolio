<?xml version="1.0" encoding="UTF-8"?>
<!--
  CONCEPT C — "OPEN HEX"
  A hexagon with one side intentionally missing (top-right is open) and a single
  small filled dot inside. Reads as: "the studio with an open door" + "one
  small unit inside a larger structure." Keeps brand continuity with the hex
  story but feels distinctive, not generic.
  Animation potential: on load, the hexagon draws itself stroke-by-stroke,
  finishing with the gap; the inner dot pops in last. On hover, the dot
  pulses softly.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <!-- Soft rounded background -->
  <rect width="400" height="400" rx="56" fill="#faf7f2"/>

  <!--
    Open hexagon — pointy-top hex with the upper-right segment removed.
    Drawn as an open path (no Z closure) so the gap is visible.
    Vertex coordinates (radius 130, centered at 200,200):
      top         (200, 70)
      top-right   (313, 135)   ← gap STARTS here
      bottom-right(313, 265)   ← gap ENDS here, path resumes
      bottom      (200, 330)
      bottom-left (87, 265)
      top-left    (87, 135)
      back to top (200, 70)
  -->
  <path d="M 313 135
           L 313 265
           L 200 330
           L 87 265
           L 87 135
           L 200 70"
        fill="none"
        stroke="#e85d04"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!--
    Inner dot — a single filled circle, off-center toward the gap.
    Reads as "one element inside, ready to step through the opening."
  -->
  <circle cx="240" cy="200" r="22" fill="#e85d04"/>

  <!--
    Subtle directional pull — a thin line from the dot toward the gap.
    Suggests motion / outward flow.
  -->
  <line x1="262" y1="200" x2="305" y2="170"
        stroke="#e85d04" stroke-width="6" stroke-linecap="round"/>
</svg>
