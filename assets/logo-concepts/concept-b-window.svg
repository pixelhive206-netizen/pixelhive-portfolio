<?xml version="1.0" encoding="UTF-8"?>
<!--
  CONCEPT B — "THE WINDOW"
  Two offset rounded squares — a back layer (orange) and a front layer (cream)
  shifted up and to the right. Reads as: a browser window emerging from a card,
  or two layered surfaces. App-icon language without being app-icon literal.
  Reasoning: modern, scales beautifully, distinctive from hex world entirely.
  Animation potential: the front "card" slides into place from below-left on
  load, then both subtly drift on hover (parallax).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <!-- Soft rounded background -->
  <rect width="400" height="400" rx="56" fill="#faf7f2"/>

  <!--
    Back card — orange, lower-left position.
    Suggests depth and "the surface below."
  -->
  <rect x="80" y="120" width="240" height="240" rx="36" fill="#e85d04"/>

  <!--
    Inner highlight inside the back card — a tiny "browser dot" trio
    in the top-left corner. Hints "this is a website."
  -->
  <g fill="#fff1e6" opacity="0.4">
    <circle cx="106" cy="148" r="6"/>
    <circle cx="126" cy="148" r="6"/>
    <circle cx="146" cy="148" r="6"/>
  </g>

  <!--
    Front card — cream, upper-right position, offset.
    The shift makes both layers visible simultaneously.
  -->
  <rect x="140" y="60" width="200" height="200" rx="32" fill="#faf7f2"
        stroke="#e85d04" stroke-width="6"/>

  <!--
    Inside the front card: a clean horizontal bar (the "P stem" implied)
    and a smaller accent square at the top. Hints at content + structure.
  -->
  <g fill="#e85d04">
    <!-- Bowl-shaped accent (mini P top) -->
    <rect x="172" y="100" width="60" height="60" rx="12"/>
    <!-- Stem (mini P body) -->
    <rect x="172" y="170" width="22" height="60" rx="6"/>
  </g>
</svg>
