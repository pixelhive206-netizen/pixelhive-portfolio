<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">

  <defs>
    <linearGradient id="maramGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a1a"/>
      <stop offset="0.5" stop-color="#1f5237"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
  </defs>

  <!-- Top section: Maram green gradient -->
  <rect x="0" y="0" width="1080" height="880" fill="url(#maramGreen)"/>

  <!-- Decorative hexagons (top) -->
  <g opacity="0.18">
    <g transform="translate(900 140)">
      <path d="M0 -90 L78 -45 L78 45 L0 90 L-78 45 L-78 -45 Z"
            fill="none" stroke="#d9f99d" stroke-width="6"/>
    </g>
    <g transform="translate(180 700)">
      <path d="M0 -50 L43 -25 L43 25 L0 50 L-43 25 L-43 -25 Z"
            fill="#d9f99d"/>
    </g>
  </g>

  <!-- CASE STUDY tag -->
  <g transform="translate(540 280)">
    <rect x="-130" y="-30" width="260" height="56" rx="28"
          fill="rgba(217, 249, 157, 0.18)"/>
    <text x="0" y="6" text-anchor="middle"
          font-family="'Inter', system-ui, sans-serif"
          font-weight="600"
          font-size="22"
          fill="#d9f99d"
          letter-spacing="4">CASE STUDY</text>
  </g>

  <!-- Main title -->
  <text x="540" y="450" text-anchor="middle"
        font-family="'Fraunces', 'Playfair Display', Georgia, serif"
        font-weight="500"
        font-size="98"
        fill="#ffffff"
        letter-spacing="-2">Maram The Tree</text>
  <text x="540" y="560" text-anchor="middle"
        font-family="'Fraunces', 'Playfair Display', Georgia, serif"
        font-weight="500"
        font-style="italic"
        font-size="98"
        fill="#d9f99d"
        letter-spacing="-2">Foundation.</text>

  <!-- Subtitle -->
  <text x="540" y="660" text-anchor="middle"
        font-family="'Inter', system-ui, sans-serif"
        font-weight="400"
        font-size="32"
        fill="rgba(255,255,255,0.78)">1 crore native trees · Tamil Nadu</text>

  <!-- Stat highlight -->
  <g transform="translate(540 780)">
    <rect x="-200" y="-32" width="400" height="64" rx="32"
          fill="rgba(255,255,255,0.12)"/>
    <text x="0" y="8" text-anchor="middle"
          font-family="'Inter', system-ui, sans-serif"
          font-weight="500"
          font-size="24"
          fill="#ffffff">🌱 350+ saplings already planted</text>
  </g>

  <!-- Bottom section: cream -->
  <rect x="0" y="880" width="1080" height="470" fill="#faf7f2"/>

  <!-- URL highlight -->
  <text x="540" y="1010" text-anchor="middle"
        font-family="'Fraunces', 'Playfair Display', Georgia, serif"
        font-weight="500"
        font-size="48"
        fill="#1a1a1a">Live → maramthetree.com</text>

  <!-- Divider -->
  <line x1="450" y1="1080" x2="630" y2="1080" stroke="#ececea" stroke-width="2"/>

  <!-- Pixelhive signature -->
  <g transform="translate(540 1170)">
    <g transform="translate(-180 0)">
      <path d="M0 -22 L19 -11 L19 11 L0 22 L-19 11 L-19 -11 Z"
            fill="none" stroke="#e85d04" stroke-width="3"/>
      <path d="M0 -11 L10 -5 L10 5 L0 11 L-10 5 L-10 -5 Z"
            fill="#e85d04"/>
    </g>
    <text x="-140" y="0"
          font-family="'Fraunces', 'Playfair Display', Georgia, serif"
          font-weight="700"
          font-size="32"
          fill="#1a1a1a"
          dominant-baseline="middle">Hand-coded by Pixelhive<tspan fill="#e85d04">.</tspan></text>
  </g>

  <!-- Swipe hint -->
  <text x="540" y="1290" text-anchor="middle"
        font-family="'Inter', system-ui, sans-serif"
        font-weight="600"
        font-size="22"
        fill="#e85d04"
        letter-spacing="3">SWIPE FOR THE FULL STORY →</text>

</svg>
