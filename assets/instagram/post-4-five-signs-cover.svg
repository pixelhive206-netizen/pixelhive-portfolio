<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">

  <!-- Background -->
  <rect width="1080" height="1350" fill="#faf7f2"/>

  <!-- Decorative hexagons -->
  <g opacity="0.07">
    <g transform="translate(940 220)">
      <path d="M0 -90 L78 -45 L78 45 L0 90 L-78 45 L-78 -45 Z"
            fill="none" stroke="#e85d04" stroke-width="7"/>
    </g>
    <g transform="translate(160 1180)">
      <path d="M0 -55 L48 -27 L48 27 L0 55 L-48 27 L-48 -27 Z"
            fill="#e85d04"/>
    </g>
  </g>

  <!-- Top label -->
  <g transform="translate(540 200)">
    <rect x="-130" y="-32" width="260" height="60" rx="30"
          fill="#fff1e6"/>
    <text x="0" y="8" text-anchor="middle"
          font-family="'Inter', system-ui, sans-serif"
          font-weight="600"
          font-size="22"
          fill="#e85d04"
          letter-spacing="4">QUICK AUDIT</text>
  </g>

  <!-- Giant "5" -->
  <text x="540" y="540" text-anchor="middle"
        font-family="'Fraunces', 'Playfair Display', Georgia, serif"
        font-weight="500"
        font-size="380"
        fill="#e85d04"
        font-style="italic">5</text>

  <!-- Title -->
  <text x="540" y="700" text-anchor="middle"
        font-family="'Fraunces', 'Playfair Display', Georgia, serif"
        font-weight="500"
        font-size="62"
        fill="#1a1a1a"
        letter-spacing="-1">signs your website</text>
  <text x="540" y="780" text-anchor="middle"
        font-family="'Fraunces', 'Playfair Display', Georgia, serif"
        font-weight="500"
        font-style="italic"
        font-size="62"
        fill="#1a1a1a"
        letter-spacing="-1">is hurting your business.</text>

  <!-- Divider -->
  <line x1="430" y1="870" x2="650" y2="870" stroke="#ececea" stroke-width="2"/>

  <!-- Subtitle -->
  <text x="540" y="940" text-anchor="middle"
        font-family="'Inter', system-ui, sans-serif"
        font-weight="400"
        font-size="30"
        fill="#6b6b6b">Most small business websites in India</text>
  <text x="540" y="985" text-anchor="middle"
        font-family="'Inter', system-ui, sans-serif"
        font-weight="400"
        font-size="30"
        fill="#6b6b6b">lose customers before the first click.</text>

  <!-- Swipe CTA -->
  <g transform="translate(540 1140)">
    <rect x="-180" y="-40" width="360" height="80" rx="40"
          fill="#1a1a1a"/>
    <text x="0" y="10" text-anchor="middle"
          font-family="'Inter', system-ui, sans-serif"
          font-weight="600"
          font-size="28"
          fill="#ffffff">Swipe to find out →</text>
  </g>

  <!-- Bottom signature -->
  <text x="540" y="1290" text-anchor="middle"
        font-family="'Inter', system-ui, sans-serif"
        font-weight="600"
        font-size="22"
        fill="#e85d04"
        letter-spacing="3">@PIXELHIVE__STUDIO</text>

</svg>
