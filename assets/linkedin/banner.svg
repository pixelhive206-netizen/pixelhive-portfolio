    <path d="M0 -30 L26 -15 L26 15 L0 30 L-26 15 L-26 -15 Z"
          fill="#e85d04"/>
  </g>

  <!-- Wordmark -->
  <text x="250" y="190" font-family="Georgia, serif" font-weight="700"
