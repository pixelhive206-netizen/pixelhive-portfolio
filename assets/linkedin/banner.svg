<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#fff1e6"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- Decorative hexagons on the right -->
  <g transform="translate(1280 50)" opacity="0.12">
    <path d="M120 0 L208 50 L208 150 L120 200 L32 150 L32 50 Z"
